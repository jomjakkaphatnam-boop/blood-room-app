<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องรับบริจาคโลหิต</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ห้องรับบริจาคเลือด">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8102e">
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;overflow:hidden;overscroll-behavior:none}
@media(prefers-color-scheme:dark){html,body{background:#271a1c}}
iframe{position:fixed;top:0;left:0;width:100vw;height:100vh;border:0;display:block;background:transparent}
@supports (height:100dvh){iframe{height:100dvh}}
#msg{display:none;color:#fff;font:16px sans-serif;padding:24px;background:#c8102e;min-height:100vh}
</style></head><body>
<div id="msg">ยังไม่ได้ตั้งค่า APP_URL ในไฟล์ config.js (ใส่ลิงก์ Web app ของ Apps Script ที่ลงท้ายด้วย /exec)</div>
<iframe id="f" allow="clipboard-write" title="ห้องรับบริจาคโลหิต"></iframe>
<script>
/* โหลด config.js แบบไม่ใช้แคช เพื่อให้ลิงก์ที่แก้ใหม่มีผลทันที */
const sc = document.createElement("script");
sc.src = "config.js?v=" + Date.now();
sc.onload = start; sc.onerror = start;
document.head.appendChild(sc);
function start() {
  const APP_URL = window.APP_URL || "";
  if (APP_URL) document.getElementById("f").src = APP_URL;
  else { document.getElementById("f").style.display = "none"; document.getElementById("msg").style.display = "block"; }
}
</script></body></html>
